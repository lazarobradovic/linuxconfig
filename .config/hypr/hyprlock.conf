# Fond d'écran
background {
    monitor =           # laisser vide = tous les écrans
    color = rgba(0, 0, 0, 1.0)
}

# Champ de saisie du mot de passe
input-field {
    monitor =
    size = 300, 50
    position = 0, -100  # relatif au centre de l'écran
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgb(255, 255, 255)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(255, 255, 255)

    placeholder_text = <i>Mot de passe...</i>  # supporte le markup Pango
    hide_input = false  # true = remplace les caractères par des points
    fade_on_empty = true
}

# Texte (ex: heure)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"  # mis à jour chaque seconde
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

# Texte statique (ex: nom d'utilisateur)
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}
